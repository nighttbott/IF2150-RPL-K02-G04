services:
  mysql:
    image: mysql:8.4
    container_name: ngaksara-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ngaksara
      MYSQL_USER: ngaksara
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: